spring:
  application:
    name: auth-service

  cloud:
    config:
      enabled: false

  security:
    oauth2:
      resource server:
        jwt:
          jwk-set-uri: http://localhost:8000/auth/.well-known/jwks.json

  datasource:
    username: root
    password: Manh2004
    url: jdbc:mysql://localhost:3306/auth

  liquibase:
    change-log: classpath:/db/changelog/appchange-log.xml
    liquibase-schema: auth

  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

private_key:
  path: D:\workspace\bus-booking-system\auth-service\private.pem

public_key:
  path: D:\workspace\bus-booking-system\auth-service\public.pem

service:
  auth:
    client-id: payment-service
    client-secret: your-secret

  users:
    url: http://localhost:8001/users

server:
  port: 8000
