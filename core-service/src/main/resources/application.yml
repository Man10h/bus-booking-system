spring:
  application:
    name: core-service

  security:
    oauth2:
      resource server:
        jwt:
          jwk-set-uri: http://localhost:8000/auth/.well-known/jwks.json

  datasource:
    url: jdbc:postgresql://localhost:5432/core
    username: postgres
    password: Manh2004
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 10
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8002
