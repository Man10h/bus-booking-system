spring:
  application:
    name: api-gateway

  cloud:
    config:
      enabled: false
  security:
    oauth2:
      resource server:
        jwt:
          jwk-set-uri: http://localhost:8000/auth/.well-known/jwks.json

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

