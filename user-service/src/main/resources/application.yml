spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:3306/users}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Manh2004}

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:/db/changelog/app-changelog.xml
    liquibase-schema: ${LIQUIBASE_SCHEMA:users}

  cloud:
    config:
      enabled: false

  security:
    oauth2:
      resource server:
        jwt:
          jwk-set-uri:  ${SPRING_SECURITY_OAUTH2_RESOURCE_SERVER_JWT_URI:http://localhost:8000/auth/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_SERVER:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true

server:
  port: 8001

kafka:
  topics:
    user-register-success: ${KAFKA_TOPICS_USER_REGISTER_SUCCESS:user.register.success}