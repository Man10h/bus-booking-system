spring:
  application:
    name: user-service

  datasource:
    username: root
    password: Manh2004
    url: jdbc:mysql://localhost:3306/users

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:/db/changelog/app-changelog.xml
    liquibase-schema: users

  cloud:
    config:
      enabled: false

  security:
    oauth2:
      resource server:
        jwt:
          jwk-set-uri: http://localhost:8000/auth/.well-known/jwks.json

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

server:
  port: 8001